<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>ArcTeknik başlatılıyor…</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      -webkit-user-select: none; user-select: none;
      cursor: default;
    }
    .stage {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 26px;
      /* Kurumsal koyu slate → emerald geçişli zemin */
      background: radial-gradient(120% 120% at 50% 0%, #134e3a 0%, #0f172a 55%, #0b1120 100%);
      color: #e2e8f0;
      position: relative;
    }
    /* İnce üst kenar vurgusu */
    .stage::before {
      content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, #10b981, #34d399, #10b981);
    }
    .logo-img {
      width: 150px; height: 150px; object-fit: contain;
      filter: drop-shadow(0 18px 40px rgba(16, 185, 129, 0.45));
      animation: float 2.4s ease-in-out infinite;
    }
    .brand { font-size: 26px; font-weight: 700; letter-spacing: 0.5px; color: #f8fafc; }
    .brand span { color: #34d399; }
    .subtitle { font-size: 13px; color: #94a3b8; margin-top: -16px; letter-spacing: 0.3px; }
    .bar {
      width: 220px; height: 4px; border-radius: 999px;
      background: rgba(148, 163, 184, 0.18); overflow: hidden; position: relative;
    }
    .bar::after {
      content: ""; position: absolute; top: 0; left: -40%;
      width: 40%; height: 100%; border-radius: 999px;
      background: linear-gradient(90deg, transparent, #34d399, #10b981, transparent);
      animation: slide 1.25s ease-in-out infinite;
    }
    .status { font-size: 12px; color: #64748b; letter-spacing: 0.4px; }
    .version { position: absolute; bottom: 14px; font-size: 11px; color: #475569; }
    @keyframes slide { 0% { left: -40%; } 100% { left: 100%; } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  </style>
</head>
<body>
  <div class="stage">
    <img class="logo-img" src="assets/icon.png" alt="ArcTeknik" />
    <div class="subtitle">İşletme Yönetim Sistemi</div>
    <div class="bar"></div>
    <div class="status">Başlatılıyor, lütfen bekleyin…</div>
    <div class="version" id="ver"></div>
  </div>
  <script>
    // Sürüm numarası ana süreçten ?v= ile gelir.
    var v = new URLSearchParams(location.search).get('v');
    if (v) document.getElementById('ver').textContent = 'Sürüm ' + v;
  </script>
</body>
</html>
